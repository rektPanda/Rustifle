[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
description = "User-space file operations, archives and line-indexed text reading for the Hello World Android app (cdylib via JNI)"
license = "MIT OR Apache-2.0"

[lib]
name = "rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.25"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
